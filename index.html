<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"  />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatfic Story</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Phone Container -->
  <div class="phone">
    <div class="screen">
      <!-- Chat Header -->
      <div class="header">
        <h3>Arjuna</h3>
      </div>

      <!-- Chat Container -->
      <div id="chat-box" class="chat-box">
        <!-- Messages appear here when tapped -->
      </div>

      <!-- Tap Indicator -->
      <div class="tap-hint">Tap anywhere on screen to play</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
