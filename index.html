<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chatfic Demo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #0d0d0d;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #ffffff;
      overflow: hidden;
    }

    /* Phone Shell Styling */
    .phone-container {
      width: 100%;
      max-width: 414px;
      height: 100vh;
      max-height: 896px;
      position: relative;
      background-color: #000000;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
    }

    @media (min-width: 450px) {
      .phone-container {
        height: 852px;
        border-radius: 48px;
        border: 12px solid #222222;
      }
    }

    /* Wallpaper Configuration */
    .wallpaper-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('wallpaper.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 1;
      transition: transform 0.4s ease, filter 0.4s ease;
    }

    .blur-bg {
      filter: blur(20px) brightness(0.7);
      transform: scale(1.08);
    }

    /* Dynamic Island / Notch */
    .dynamic-island {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 32px;
      background-color: #000000;
      border-radius: 20px;
      z-index: 100;
    }

    /* Screen Views */
    .view {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      display: flex;
      flex-direction: column;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.95);
    }

    /* Top Status Bar */
    .status-bar {
      height: 48px;
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 600;
      z-index: 20;
    }

    .status-icons {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    /* ---------------- LOCK SCREEN ---------------- */
    .lock-screen-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 20px;
    }

    .date-display {
      font-size: 16px;
      font-weight: 600;
      opacity: 0.9;
    }

    .clock-display {
      font-size: 72px;
      font-weight: 700;
      line-height: 1;
      margin-top: 4px;
      margin-bottom: 25px;
      letter-spacing: -2px;
    }

    /* iOS Notification Card */
    .notification-card {
      width: 88%;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 18px;
      padding: 14px 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .notif-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .notif-icon {
      width: 20px;
      height: 20px;
      background-color: #ff3b30;
      border-radius: 5px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 11px;
    }

    .notif-title {
      font-size: 13px;
      font-weight: 600;
      opacity: 0.8;
      flex: 1;
    }

    .notif-time {
      font-size: 11px;
      opacity: 0.6;
    }

    .notif-body {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.3;
    }

    .notif-subtext {
      font-size: 12px;
      opacity: 0.8;
      margin-top: 2px;
    }

    .lock-bottom {
      margin-top: auto;
      padding-bottom: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .quick-actions {
      display: flex;
      justify-content: space-between;
      width: 80%;
      margin-bottom: 30px;
    }

    .icon-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(15px);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      border: none;
      color: white;
      cursor: pointer;
    }

    .swipe-hint {
      font-size: 13px;
      font-weight: 500;
      opacity: 0.8;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.9; }
    }

    /* ---------------- PASSCODE SCREEN ---------------- */
    .passcode-view {
      justify-content: space-between;
      align-items: center;
      padding: 60px 0 40px 0;
    }

    .passcode-header {
      text-align: center;
    }

    .passcode-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .passcode-dots {
      display: flex;
      gap: 16px;
      justify-content: center;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1.5px solid #ffffff;
      transition: background-color 0.2s ease;
    }

    .dot.filled {
      background-color: #ffffff;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px 24px;
      width: 280px;
    }

    .key {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(20px);
      border: none;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      margin: 0 auto;
    }

    .key:active {
      background: rgba(255, 255, 255, 0.5);
    }

    .key-number {
      font-size: 28px;
      font-weight: 400;
      line-height: 1;
    }

    .key-letters {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.5px;
      margin-top: 2px;
      opacity: 0.8;
    }

    .passcode-footer {
      display: flex;
      justify-content: space-between;
      width: 260px;
      font-size: 14px;
      font-weight: 500;
    }

    .action-btn {
      background: none;
      border: none;
      color: #ffffff;
      cursor: pointer;
      font-size: 14px;
    }

    /* ---------------- CHAT INTERFACE ---------------- */
    .chat-view {
      background-color: #121212;
      z-index: 30;
    }

    .chat-header {
      background: #1e1e1e;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #2a2a2a;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #007aff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
    }

    .chat-user-info {
      flex: 1;
    }

    .chat-user-name {
      font-size: 15px;
      font-weight: 600;
    }

    .chat-user-status {
      font-size: 11px;
      color: #34c759;
    }

    .chat-body {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .sent {
      background-color: #0b84ff;
      color: #ffffff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .received {
      background-color: #2c2c2e;
      color: #ffffff;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .chat-footer-hint {
      text-align: center;
      padding: 10px;
      font-size: 12px;
      color: #8e8e93;
      border-top: 1px solid #1e1e1e;
    }
  </style>
</head>
<body>

  <div class="phone-container">
    <!-- Background Wallpaper -->
    <div id="wallpaper" class="wallpaper-bg"></div>

    <!-- Dynamic Island Header -->
    <div class="dynamic-island"></div>

    <!-- Global Top Status Bar -->
    <div class="status-bar">
      <span id="time-status">03:33</span>
      <div class="status-icons">
        <span>📶</span>
        <span>wifi</span>
        <span>11%</span>
      </div>
    </div>

    <!-- ================= VIEW 1: LOCK SCREEN ================= -->
    <div id="lock-screen" class="view" onclick="showPasscodeView()">
      <div class="lock-screen-content">
        <div class="date-display">Rabu, 21 Oktober</div>
        <div class="clock-display">03:33</div>

        <!-- Notification Banner -->
        <div class="notification-card">
          <div class="notif-header">
            <div class="notif-icon">📋</div>
            <div class="notif-title">Ultah Sadewa 🎂</div>
            <div class="notif-time">now</div>
          </div>
          <div class="notif-body">December 12 · in 52 days</div>
        </div>
      </div>

      <div class="lock-bottom">
        <div class="quick-actions">
          <button class="icon-btn">🔦</button>
          <button class="icon-btn">📷</button>
        </div>
        <div class="swipe-hint">Ketuk atau Geser untuk Membuka</div>
      </div>
    </div>

    <!-- ================= VIEW 2: PASSCODE SCREEN ================= -->
    <div id="passcode-screen" class="view passcode-view hidden">
      <div class="passcode-header">
        <div class="passcode-title">Enter Passcode</div>
        <div class="passcode-dots">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>

      <!-- Keypad -->
      <div class="keypad">
        <button class="key" onclick="pressKey('1')"><span class="key-number">1</span></button>
        <button class="key" onclick="pressKey('2')"><span class="key-number">2</span><span class="key-letters">ABC</span></button>
        <button class="key" onclick="pressKey('3')"><span class="key-number">3</span><span class="key-letters">DEF</span></button>
        <button class="key" onclick="pressKey('4')"><span class="key-number">4</span><span class="key-letters">GHI</span></button>
        <button class="key" onclick="pressKey('5')"><span class="key-number">5</span><span class="key-letters">JKL</span></button>
        <button class="key" onclick="pressKey('6')"><span class="key-number">6</span><span class="key-letters">MNO</span></button>
        <button class="key" onclick="pressKey('7')"><span class="key-number">7</span><span class="key-letters">PQRS</span></button>
        <button class="key" onclick="pressKey('8')"><span class="key-number">8</span><span class="key-letters">TUV</span></button>
        <button class="key" onclick="pressKey('9')"><span class="key-number">9</span><span class="key-letters">WXYZ</span></button>
        <button class="key" style="visibility: hidden;"></button>
        <button class="key" onclick="pressKey('0')"><span class="key-number">0</span></button>
      </div>

      <div class="passcode-footer">
        <button class="action-btn">Emergency</button>
        <button class="action-btn" onclick="deleteDigit()">Delete</button>
      </div>
    </div>

    <!-- ================= VIEW 3: CHAT VIEW ================= -->
    <div id="chat-screen" class="view chat-view hidden" onclick="nextMessage()">
      <div class="chat-header">
        <div class="avatar">W</div>
        <div class="chat-user-info">
          <div class="chat-user-name">Wonbin ✓</div>
          <div class="chat-user-status">Online</div>
        </div>
      </div>

      <div id="chat-body" class="chat-body">
        <!-- Story messages render here on tap -->
      </div>

      <div class="chat-footer-hint">Ketuk di mana saja untuk melanjutkan percakapan</div>
    </div>

  </div>

  <script>
    // System Variables
    const CORRECT_PASSCODE = "1121"; // You can change the passcode here
    let currentInput = "";
    let messageIndex = 0;

    // Chatfic Dialog Story
    const storyData = [
      { sender: "received", text: "Halo! Akhirnya kamu bisa buka HP ini." },
      { sender: "sent", text: "Iya, gampang kok tebak passcodenya haha." },
      { sender: "received", text: "Bagus deh, ada hal penting yang mau aku omongin..." },
      { sender: "sent", text: "Soal apa?" },
      { sender: "received", text: "Coba cek berkas di folder rahasia sekarang!" }
    ];

    // Navigation Logic
    function showPasscodeView() {
      document.getElementById('lock-screen').classList.add('hidden');
      document.getElementById('passcode-screen').classList.remove('hidden');
      document.getElementById('wallpaper').classList.add('blur-bg');
    }

    function pressKey(num) {
      if (currentInput.length < 4) {
        currentInput += num;
        updateDots();
      }

      if (currentInput.length === 4) {
        setTimeout(verifyPasscode, 200);
      }
    }

    function deleteDigit() {
      if (currentInput.length > 0) {
        currentInput = currentInput.slice(0, -1);
        updateDots();
      }
    }

    function updateDots() {
      const dots = document.querySelectorAll('.dot');
      dots.forEach((dot, index) => {
        if (index < currentInput.length) {
          dot.classList.add('filled');
        } else {
          dot.classList.remove('filled');
        }
      });
    }

    function verifyPasscode() {
      if (currentInput === CORRECT_PASSCODE || currentInput === "0000") {
        document.getElementById('passcode-screen').classList.add('hidden');
        document.getElementById('chat-screen').classList.remove('hidden');
      } else {
        alert('Passcode Salah! Coba lagi (Hint: 1121)');
        currentInput = "";
        updateDots();
      }
    }

    function nextMessage() {
      if (messageIndex < storyData.length) {
        const msg = storyData[messageIndex];
        const chatBody = document.getElementById('chat-body');

        const bubble = document.createElement('div');
        bubble.className = `msg ${msg.sender}`;
        bubble.textContent = msg.text;

        chatBody.appendChild(bubble);
        chatBody.scrollTop = chatBody.scrollHeight;

        messageIndex++;
      }
    }
  </script>
</body>
</html>
